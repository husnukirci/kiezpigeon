name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: kiezpigeon-chrome-mv3
          path: .output/chrome-mv3/
          if-no-files-found: error

  e2e:
    # The never-submit run against the built extension (PLAN.md section 5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No --with-deps: the runner image already has Chromium's libraries, and the
      # apt step fails the job whenever Ubuntu's package servers cannot be reached.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
