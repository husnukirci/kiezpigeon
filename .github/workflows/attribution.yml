name: Attribution

# No AI co-author trailer or footer in a PR's commits or description (the
# author's global rules; `scripts/attribution.ts`). Its own workflow so an
# edited description reruns only this check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit messages
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: PR description
        run: node scripts/attribution.ts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
